[workspace]
resolver = "2"
members = ["what-time", "what-time-cli", "what-time-web", "what-time-wasm"]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
wgpu = "30"
pollster = "1"
bytemuck = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jiff = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
